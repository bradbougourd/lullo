<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://ljsynbarpwvzniuejeyr.supabase.co; base-uri 'none'; form-action 'none'">
<title>Lullo</title>
<style>
  html.framed body { display:none; }
  :root { --night:#2B2770; --peach:#F4A06B; --peachsoft:#FDEBDD; --teal:#2F9C95; --tealsoft:#DDF3F0; --ink:#1C1A33; --muted:#5E5B78; --bg:#F7F6FB; --lav:#E6E4F7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-rounded, -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:520px; margin:0 auto; padding:20px 18px 40px; }
  h1 { font-size:28px; margin:6px 0 2px; }
  .muted { color:var(--muted); font-size:14px; }
  .hero { background:var(--night); color:#fff; border-radius:24px; padding:18px; margin:16px 0; }
  .hero .label { font-size:12px; letter-spacing:1px; font-weight:800; color:#C9C6F2; }
  .hero .big { font-size:38px; font-weight:900; margin:4px 0; }
  .hero .sub { color:#FFD2B3; font-weight:700; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { font:inherit; border:0; border-radius:20px; padding:20px 14px; font-weight:800; font-size:17px; cursor:pointer; }
  .sleep { background:#4A44C6; color:#fff; } .feed { background:#FBD9C2; } .wet { background:#CDEEEA; } .dirty { background:#CDEEEA; }
  .card { background:#fff; border-radius:18px; padding:14px; margin-top:12px; }
  .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #ECEAF5; font-size:15px; }
  .row:last-child { border-bottom:0; }
  input { font:inherit; padding:12px; border-radius:12px; border:1.5px solid #E3E1EE; width:100%; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; display:none; }
  .ml { display:flex; gap:8px; margin-top:10px; }
  .ml input { flex:1; } .ml button { padding:12px 16px; font-size:15px; background:var(--peach); }
  a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <div id="app"><p class="muted">Loading…</p></div>
</main>
<div class="toast" id="toast"></div>
<script src="care.js"></script>
</body>
</html>
